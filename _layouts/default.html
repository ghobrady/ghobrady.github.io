<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#e6e8e8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script>
      document.documentElement.classList.add("bookshelf-loading");
      // Decode the scan while the renderer's JavaScript is downloading/parsing.
      const bindingScan = new Image();
      bindingScan.src = "{{ '/assets/materials/binding-grain.webp' | relative_url }}";
      window.bookshelfGrain = bindingScan.decode().then(() => bindingScan);
      window.bookshelfGrain.catch(() => {});
    </script>
    <link rel="preload" as="image" href="{{ '/assets/materials/binding-grain.webp' | relative_url }}" fetchpriority="high">
    <link rel="preload" as="image" href="{{ '/assets/materials/cool-fine-plaster.webp' | relative_url }}">
    <link rel="modulepreload" href="{{ site.data.runtime.script | default: '/assets/js/site.js' | relative_url }}?v={{ site.data.runtime.version | default: 'source' }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=direct-first-paint-1">
    <script src="{{ site.data.runtime.script | default: '/assets/js/site.js' | relative_url }}?v={{ site.data.runtime.version | default: 'source' }}" type="module" onerror="document.documentElement.classList.remove('bookshelf-loading')"></script>
  </head>
  <body>
    {{ content }}
  </body>
</html>
