<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#e6e8e8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>document.documentElement.classList.add("bookshelf-loading");</script>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" as="image" href="{{ '/assets/materials/binding-grain.webp' | relative_url }}" crossorigin="anonymous" fetchpriority="high">
    <link rel="modulepreload" href="{{ '/assets/vendor/three.module.js' | relative_url }}">
    <link rel="modulepreload" href="{{ '/assets/js/bookshelf-scene.mjs' | relative_url }}?v=first-paint-1">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=first-paint-1">
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=first-paint-1" type="module" onerror="document.documentElement.classList.remove('bookshelf-loading')"></script>
  </head>
  <body>
    {{ content }}
  </body>
</html>
