<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#faf8f3">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/pages.css' | relative_url }}?v=content-pages-11">
    <link rel="alternate" type="application/rss+xml" title="Brady Gho — Writing" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body class="content-page">
    {{ content }}
  </body>
</html>
