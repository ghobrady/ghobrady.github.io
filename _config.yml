title: Brady Gho
description: A quiet personal index of writing, projects, people, and curiosities.
lang: en
url: "https://ghobrady.github.io"
baseurl: ""
permalink: pretty
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /writing/:title/

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - GEOMETRY.md
  - tests
  - tools
  - output
  - assets/previews/README.md
  - assets/materials/README.md
  - assets/images/README.md
  - assets/models/README.md
  - assets/vendor/README.md
  - assets/vendor/package.json
